[build]
  publish = "."
  command = "echo geen build nodig"
  # exitcode 0 = OVERSLAAN, 1 = BOUWEN. Bouw alleen als er iets buiten data/ en
  # scripts/state/ is gewijzigd; die twee bevatten uitsluitend opgehaalde cijfers.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data' ':(exclude)scripts/state'"

# ── WANNEER NETLIFY WEL EN NIET PUBLICEERT ────────────────────────────────────
#
# Wat er misging. Elke ronde van de GitHub Action duwt verse data naar de
# repository. Netlify publiceerde daarop, ook al veranderde de pagina zelf niet,
# en dat kostte 15 credits per keer. Bij acht rondes per dag is dat ruim
# vierduizend credits per maand voor een site die niet wijzigt. Justins tegoed
# was daardoor halverwege september op.
#
# Waarom het filter er eerder úit ging. Toen haalde de pagina zijn data op van
# data/dashboard.json op DEZE site. Sla je de publicatie over, dan blijft dat
# bestand staan zoals het bij de laatste bouw was en toont het dashboard voor
# altijd oude cijfers. Het filter alleen was dus fout — maar het weghalen ook.
#
# Wat nu klopt. De pagina haalt zijn data rechtstreeks bij GitHub op
# (raw.githubusercontent.com, met access-control-allow-origin: *), en valt terug
# op de lokale kopie als dat niet lukt. Daardoor mag Netlify de publicatie
# gerust overslaan: de data komt niet meer van hier.
#
# VOORWAARDE: de repository moet PUBLIEK zijn. raw.githubusercontent.com weigert
# privérepositories zonder token, en een token hoort niet in een pagina die
# iedereen kan openen. Staat hij op privé, dan valt de site terug op zijn eigen
# kopie en zie je weer bevroren data — precies het probleem van hiervoor.
#
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# De data komt van GitHub, dus de browser moet die host mogen benaderen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
